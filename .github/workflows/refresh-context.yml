name: Refresh Architecture Context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENCODE_AUTH_TOKEN: ${{ secrets.OPENCODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for opencode)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure opencode
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "deepseek/deepseek-v4-pro",
            "provider": {
              "deepseek": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "DeepSeek",
                "options": {
                  "baseURL": "https://api.deepseek.com/v1",
                  "apiKey": "{env:OPENCODE_AUTH_TOKEN}"
                },
                "models": {
                  "deepseek-v4-flash": {
                    "name": "deepseek-v4-flash",
                    "limit": {
                      "context": 200000,
                      "output": 32768
                    }
                  },
                  "deepseek-v4-pro": {
                    "name": "deepseek-v4-pro",
                    "limit": {
                      "context": 200000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Add MCP Server for opencode
        run: |
          opencode mcp add triton-report \
            -- python -m src.mcp_server_app \
            --data-dir "${{ github.workspace }}/data" \
            --ascend-repo-path "${{ github.workspace }}/repos/triton-ascend"

      - name: Checkout triton source
        uses: actions/checkout@v4
        with:
          repository: triton-lang/triton
          path: repos/triton
          fetch-depth: 0

      - name: Checkout triton-ascend source
        uses: actions/checkout@v4
        with:
          repository: triton-lang/triton-ascend
          path: repos/triton-ascend
          fetch-depth: 0

      - name: Generate triton architecture context
        run: python src/data/generate_context.py --repo triton-lang/triton --force --data-dir data --local-repo repos/triton

      - name: Generate triton-ascend architecture context
        run: python src/data/generate_context.py --repo triton-lang/triton-ascend --force --data-dir data --local-repo repos/triton-ascend

      - name: Cross-reference triton vs triton-ascend
        run: python src/data/generate_context.py --cross-reference --force --data-dir data

      - name: Rebuild search index
        run: python src/data/build_index.py --data-dir data

      - name: Track adaptation
        run: |
          if [ -f "data/triton-ascend/adaptation-status.json" ]; then
            python src/data/track_adaptation.py detect --ascend-repo-path repos/triton-ascend --data-dir data
          else
            python src/data/track_adaptation.py init --ascend-repo-path repos/triton-ascend --data-dir data
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update architecture context $(TZ=Asia/Shanghai date +%Y-%m-%d)" && git push)